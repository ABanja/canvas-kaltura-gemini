name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run check
      - run: npm test

      - name: Verify tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          manifest_version=$(node -p "require('./extension/manifest.json').version")
          if [ "v$manifest_version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $manifest_version" >&2
            exit 1
          fi

      - name: Package extension
        run: cd extension && zip -r "../canvas-kaltura-gemini-${GITHUB_REF_NAME//\//-}.zip" . -x '.*'

      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: canvas-kaltura-gemini-*.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: canvas-kaltura-gemini-*.zip
          generate_release_notes: true
